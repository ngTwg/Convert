[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiconvert"
version = "0.1.0"
description = "Desktop multi-format converter with editing workflow"
requires-python = ">=3.11"
dependencies = [
  "pypandoc>=1.13",
  "pypandoc_binary>=1.13",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7.0",
]
ocr = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "pdf2image>=1.17.0",
  "python-docx>=1.1.0",
]
all = [
  "PySide6>=6.7.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "pdf2image>=1.17.0",
  "python-docx>=1.1.0",
]

[project.scripts]
multiconvert = "multiconvert.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
